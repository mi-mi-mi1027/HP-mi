<script src="https://code.jquery.com/jquery-3.4.1.js"></script>
<script src="common/js/lightbox.min.js"></script>
<script>
    $(function () {
    //　▼画像のfade-up
const fadeUps = document.querySelectorAll( '.fade-up');

const observer1 = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('show');
        }
    });
});

fadeUps.forEach(el => observer1.observe(el));
//　▼文字を一文字ずつ分割
document.querySelectorAll('.fade-text').forEach(text => {
    const chars = text.textContent.trim().split('');
    text.innerHTML = chars.map(c => `<span>${c}</span>`).join('');
});
// 文字のfade-up
const fadeTexts = document.querySelectorAll('.fade-text');

const observer2 = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if(entry.isIntersecting) {
            entry.target.classList.add('show');
        }
    });
});
fadeTexts.forEach(el => observer2.observe(el));

  // Lightboxのオプション設定
  lightbox.option({
    'wrapAround': true, // 最後まで見たあと最初に戻る
    'alwaysShowNavOnTouchDevices': true //スマホでも操作用の矢印を常に表示
  });
})
</script>
